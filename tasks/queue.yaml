- objective: The model may need some clearer logic to understand where to put a half
    crossover or full crossover. A half crossover on the left or right is typically
    on the leftmost or rightmost valid crossover position. It is the leftmost or rightmost
    because there is not another valid crossover position to the left or right of
    it. In some cases, creating a half crossover may truncate off the remaining strands,
    which will have an exposed 3 prime or 5 prime end, depending on which side of
    the structure they are on. Those strands get deleted. As an example, design and
    screenshot the cadnano design for a flat 4-helix sheet. Between helices 0 and
    1, it would have two half crossovers, one on the left and one on the right. Between
    helices 1 and 2, it would half a single full crossover in the midpoint of the
    strands. Then, between helices 2 and 3, it would have two half crossovers again,
    one on the left and one on the right, but not necessarily in the same positions
    as those between helices 0 and 1.
