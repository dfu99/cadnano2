    augmented_examples: 192
    augmentation_factor: 3.9
    unique_images: 39
    categories: 5
    paraphrase_templates: 8
  figures:
  - results/obj-012-instruction-augmentation.png
  conclusions: >-
    Template-based augmentation is a lightweight way to scale instruction
    diversity without new images. 192 training examples across 5 categories
