- id: obj-018
  status: completed
  statement: Build geometric reward scorer using tacoxDNA for automated 3D shape verification
  methodology: >-
    Built tools/oxdna_geometric_reward.py — end-to-end pipeline: cadnano JSON
    → tacoxDNA → oxDNA coordinates → PCA shape analysis → continuous reward [0,1].
    Tested on 7 designs: correct flat sheets, defective variants (no crossovers,
    partial crossovers, scaffold-only), wrong shape class (2×3 grid), and tube.
    Reward function uses weighted flatness (40%), planarity (35%), circularity (25%).
  metrics:
    correct_flat_sheet_reward: 0.948
    wrong_shape_grid_reward: 0.421
    correct_tube_reward: 0.619
    designs_tested: 7
    figures_generated: 3
    discrimination_gap: 0.527
  figures:
  - results/oxdna_geometric_reward/fig1_reward_discrimination.png
  - results/oxdna_geometric_reward/fig2_cross_section_comparison.png
  - results/oxdna_geometric_reward/fig3_reward_landscape.png
  conclusions: >-
    The geometric reward reliably discriminates helix arrangement (flat sheet
    0.95 vs grid 0.42) but not crossover connectivity, because tacoxDNA places
    nucleotides by lattice position, not by strand connectivity. This makes the
    geometric reward orthogonal to the structural verifier — together they cover
    both shape correctness and connectivity correctness. Recommended: combine
    as 0.7×structural + 0.3×geometric for total RLVR reward.
  connects_to: obj-019
  completed_date: '2026-03-13'
- id: obj-019
  status: completed
  statement: Rectilinear prism fit metric for oxDNA flat sheet verification
  methodology: >-
    Built tools/oxdna_prism_fit.py — PCA-aligns oxDNA 3D nucleotide coordinates,
    fits an oriented bounding box (rectilinear prism), and computes composite
    prism_fit_score from three components: grid uniformity (how evenly nucleotides
    fill the prism volume), rectangularity (convex hull area / bounding rect area
    of cross-section), and slice consistency (CV of cross-section dimensions along
    the sheet length). Analyzed existing 6-helix flat sheet (1512 nucleotides).
    Generated 3 purposeful diagnostic figures.
  metrics:
    prism_dimensions_nm: "41.5 × 10.5 × 2.4"
    prism_fit_score: 0.793
    uniformity: 0.667
    rectangularity: 0.754
    slice_width_cv: 0.0008
    slice_thickness_cv: 0.0032
    flatness_ratio: 0.0576
    aspect_ratio: 3.96
    n_nucleotides: 1512
    n_strands: 51
    variance_explained_pc1: "93.1%"
  figures:
  - results/oxdna_flat_sheet/fig1_prism_wireframe.png
  - results/oxdna_flat_sheet/fig2_cross_sections.png
  - results/oxdna_flat_sheet/fig3_density_heatmap.png
  conclusions: >-
    The 6-helix flat sheet scores 0.793 on the prism fit metric, with excellent
    cross-section uniformity (width CV = 0.0008) but moderate volume fill (uniformity
    0.667) due to the inherent spacing between DNA helices. The 0.754 rectangularity
    reflects the cylindrical helix cross-sections within the rectangular prism.
    Key insight: the score ceiling for DNA origami is ~0.8, not 1.0, because
    individual helices are cylindrical, not rectangular. This metric is best used
    as a relative comparator between designs rather than an absolute threshold.
    Pipeline: cadnano → tacoxDNA → oxDNA → prism_fit_score → RLVR reward.
  connects_to: obj-020
  completed_date: '2026-03-13'
