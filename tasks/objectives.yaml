  status: completed
  statement: Template-based instruction augmentation scales dataset 3.9x to 192 examples
  methodology: >-
    Built tools/augment_instructions.py with operation-specific paraphrase
    generators (move, create, remove, batch, resize, insertion, break). Each
    of 39 original instructions gets 3-5 paraphrases varying formality,
    specificity, and phrasing style. Exported as HuggingFace dataset.
  metrics:
