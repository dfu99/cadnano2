- id: obj-007
  status: completed
  statement: cadnano-to-oxDNA pipeline validates flat sheet as rectilinear prism
  methodology: >-
    Built tools/oxdna_flat_sheet.py: creates 6-helix x 126bp flat sheet in cadnano,
    converts to oxDNA via tacoxDNA, parses 3D nucleotide coordinates, fits PCA-aligned
    bounding box. Measures flatness ratio, planarity RMS, and prism dimensions.
  metrics:
    nucleotides: 1512
    strands: 51
    pca_dims_nm: [41.5, 10.5, 2.4]
    flatness_ratio: 0.0576
    rms_planarity_nm: 0.63
    aspect_ratio: 3.96
  figures:
  - results/oxdna_flat_sheet_3d.png
  - results/oxdna_flat_sheet_planarity.png
  - results/oxdna_flat_sheet_prism_dims.png
  conclusions: >-
    The cadnano-to-oxDNA pipeline works end-to-end. The 6-helix flat sheet
    maps to a 41.5 x 10.5 x 2.4 nm rectilinear prism with flatness ratio
    0.058 and planarity RMS 0.63 nm (~1 DNA diameter). This geometric
    validation enables automated shape verification of cadnano designs.
  connects_to: null
  completed_date: '2026-03-11'
