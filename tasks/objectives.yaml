- id: obj-021
  status: completed
  statement: Add edge vs interior crossover decision logic for half/double crossovers
  methodology: >-
    Added is_edge annotation to suggestCrossovers (first/last valid positions
    between a helix pair). Added crossover_type parameter ("auto"/"double"/"half")
    to addCrossoversForPair and addAllNeighborCrossovers. In "auto" mode (default),
    scaffold edge positions create half-crossovers (single strand crossing at
    the turn), interior positions create double crossovers. Staple crossovers
    always use double. Updated system prompts and tool schemas to explain the
    edge vs interior rule. Added 5 new headless tests.
  metrics:
    new_tests: 5
    original_tests_passing: 12
    files_changed: 6
    lines_added: 394
    lines_removed: 80
    crossover_types: 3
    edge_positions_per_pair: 2
  figures:
  - results/obj-021-edge-crossover-logic.png
  conclusions: >-
    The model now has encoded domain knowledge about when to use half vs double
    crossovers. Edge positions (first/last valid crossover between a helix pair)
    use half-crossovers for scaffold routing, matching DNA origami conventions.
    The "auto" default means existing workflows that don't specify crossover_type
    will automatically get correct behavior. The "double" mode preserves legacy
    behavior for backward compatibility.
  connects_to: obj-022
  completed_date: '2026-03-14'

- id: obj-022
  status: completed
  statement: Upgrade crossover logic from naive edge heuristic to routing-aware turns
  methodology: >-
    Replaced first/last edge heuristic with parity-aware routing turn detection.
    Added inferScaffoldRoute() — computes Hamiltonian cycle through helix neighbor
    graph via DFS, determines turn position per pair based on helix parity (even
    exits right, odd exits left). suggestCrossovers now annotates is_routing_turn
    (1 per pair) and always includes the turn in recommendations. addCrossoversForPair
    auto mode creates exactly 1 half-crossover at the routing turn. addAllNeighborCrossovers
    auto scaffold infers routing path — non-routing pairs get only double crossovers.
    Updated tool schemas, system prompts, and query method whitelist.
  metrics:
    new_tests: 8
    original_tests_passing: 12
    files_changed: 7
    lines_added: 445
    lines_removed: 74
    half_crossovers_per_pair: 1
    routing_turn_detection: parity-based
    hamiltonian_cycle_solver: DFS
