  - screenshots/move_crossover_right_3/before.png
  - screenshots/move_crossover_right_3/after.png
  - screenshots/add_4_evenly_spaced_crossovers/after.png
  conclusions: >-
    Headless screenshot capture enables automated generation of visual training
